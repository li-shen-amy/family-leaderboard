<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Family Leaderboard</title>
<link rel="stylesheet" href="styles.css">
<!-- Optional display font; the app degrades gracefully to system fonts offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-icon" data-icon="trophy"></span>
    <h1>Family Leaderboard</h1>
  </div>
  <div class="profile-switch" id="profileSwitch" role="tablist" aria-label="Choose profile"></div>
  <div class="xp-strip" id="xpStrip"></div>
</header>

<main id="main" class="main"></main>

<nav class="tabbar" id="tabbar" aria-label="Main tabs"></nav>

<!-- Floating pill shown while a practice timer is running -->
<button class="timer-pill" id="timerPill" data-action="goto-log" hidden></button>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<!-- Full-screen celebration layer -->
<canvas id="confettiCv" class="confetti-cv" hidden></canvas>
<div id="celebrateBanner" class="celebrate-banner" hidden></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="auth.js"></script>
<script src="sync.js"></script>
<script src="ui.js"></script>
</body>
</html>
